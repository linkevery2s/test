<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Word Cloud App</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.1.1/wordcloud2.min.js"></script>
</head>
<body>

<h2>ワードクラウド生成</h2>

<textarea id="text" rows="10" cols="50">
this is a test this is a test word cloud test test data visualization
</textarea>
<br>
<button onclick="generate()">生成</button>

<div id="cloud" style="width:500px; height:300px; border:1px solid #ccc;"></div>

<script>
function generate() {
  const text = document.getElementById("text").value;

  const words = text.toLowerCase().match(/\b\w+\b/g);

  if (!words) {
    alert("単語が検出できませんでした");
    return;
  }

  const count = {};
  words.forEach(word => {
    count[word] = (count[word] || 0) + 1;
  });

  const list = Object.entries(count);

  WordCloud(document.getElementById('cloud'), {
    list: list,
    gridSize: 8,
    weightFactor: 10,
    backgroundColor: '#fff'
  });
}
</script>

</body>
</html>
